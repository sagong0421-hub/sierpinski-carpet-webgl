<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" >
<title>2D Sierpinski Gasket</title>


<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec4 vPosition;

void
main()
{
    gl_Position = vPosition;
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float;

uniform vec4 uColor;

void
main()
{
    gl_FragColor = uColor;
}
</script>

<script type="text/javascript" src="../../WebGL-master/Common/webgl-utils.js"></script>
<script type="text/javascript" src="../../WebGL-master/Common/initShaders.js"></script>
<script type="text/javascript" src="../../WebGL-master/Common/MV.js"></script>
<script type="text/javascript" src="Sierpinski Carpet.js"></script>
</head>

<body>
<div>
recursive steps  0 <input id="slider" type="range"
 min= "0" max= "6" step = "1" value = "0" />
 6
</div>

<div>

    <input id="colorPicker" type="color" value="#ff0000">
</div>

</html>
